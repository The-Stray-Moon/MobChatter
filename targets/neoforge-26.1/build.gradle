plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'me.modmuss50.mod-publish-plugin' version '2.1.1'
}

apply from: file('../../gradle/target-conventions/shared.gradle')

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

commonJava {
    // Exclude only common files with confirmed differences for this target.
}

tasks.named('sourcesJar', Jar).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

neoForge {
    version = neoforge_261_version

    runs {
        client {
            client()
            gameDirectory = file('run')
        }

        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenCentral()
    mavenLocal()
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter { includeGroup "maven.modrinth" }
    }
}

dependencies {
    compileOnly files('libs/curios-15.0.0-beta.1+26.1.jar')
    jarJar(implementation('org.tukaani:xz:1.10'))
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        // KubeJS 26.1 depends on these through version ranges that only maven.latvian.dev
        // can list. Pin the cached builds so hot-debug resolves without that host.
        if (details.requested.group == 'dev.latvian.mods' && details.requested.name == 'better-advanced-tooltips') {
            details.useVersion '2601.1.0-build.9'
        }
        if (details.requested.group == 'dev.latvian.apps' && details.requested.name == 'tiny-java-server') {
            details.useVersion '1.0.0-build.45'
        }
        if (details.requested.group == 'com.github.rtyley' && details.requested.name == 'animated-gif-lib-for-java') {
            details.useVersion 'animated-gif-lib-1.7'
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def replaceProperties = [
            minecraft_version     : neoforge_261_minecraft_version,
            neoforge_version      : neoforge_261_version,
            neoforge_version_range: neoforge_261_version_range,
            mod_id                : mod_id,
            mod_name              : mod_name,
            mod_license           : mod_license,
            mod_version           : mod_version,
            mod_authors           : mod_authors,
            mod_description       : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties + [project: project]
    }
}

apply from: file('../../gradle/target-conventions/hot-debug.gradle')
apply from: file('../../gradle/target-conventions/publish.gradle')

// NeoForge 26.1 has no additional runtime classpath, so hot-debug mods must join the normal runtime classpath.
dependencies {
    runtimeOnly files(configurations.hotDebugRuntime)
}
