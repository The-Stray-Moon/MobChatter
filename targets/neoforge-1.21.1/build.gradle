plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'me.modmuss50.mod-publish-plugin' version '2.1.1'
}

apply from: file('../../gradle/target-conventions/shared.gradle')

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

commonJava {
    // Exclude only common files with confirmed differences for this target.
}

tasks.named('sourcesJar', Jar).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

neoForge {
    version = neoforge_121_version

    runs {
        client {
            client()
            gameDirectory = file('run')
        }

        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenCentral()
    mavenLocal()
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter { includeGroup "maven.modrinth" }
    }
}

dependencies {
    compileOnly files('libs/curios-9.5.1+1.21.1.jar')
    jarJar(implementation('org.tukaani:xz:1.10'))
    // Legacy classpath entries are visible to the mod class loader in dev; the plain
    // implementation dependency is not.
    additionalRuntimeClasspath 'org.tukaani:xz:1.10'
}

configurations.configureEach {
    resolutionStrategy {
        // KubeJS 2101.7.2 depends on these modules through version ranges, which forces a
        // maven-metadata.xml lookup on maven.latvian.dev. Pin the cached builds instead.
        force 'dev.latvian.apps:tiny-java-server:1.0.0-build.33'
        force 'dev.latvian.mods:better-advanced-tooltips:2101.1.0-build.1'
    }
}

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def replaceProperties = [
            minecraft_version     : neoforge_121_minecraft_version,
            neoforge_version      : neoforge_121_version,
            neoforge_version_range: neoforge_121_version_range,
            mod_id                : mod_id,
            mod_name              : mod_name,
            mod_license           : mod_license,
            mod_version           : mod_version,
            mod_authors           : mod_authors,
            mod_description       : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties + [project: project]
    }
}

apply from: file('../../gradle/target-conventions/hot-debug.gradle')
// FML discovers mods from the source set runtime classpath, not from the legacy classpath.
configurations.runtimeClasspath.extendsFrom(configurations.hotDebugRuntime)
neoForge.runs.configureEach {
    additionalRuntimeClasspathConfiguration.setExtendsFrom(
            additionalRuntimeClasspathConfiguration.extendsFrom.findAll { it != configurations.hotDebugRuntime })
}
apply from: file('../../gradle/target-conventions/publish.gradle')
