plugins {
    id 'eclipse'
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'jacoco'
    id 'net.neoforged.moddev.legacyforge' version '2.0.91'
    id 'me.modmuss50.mod-publish-plugin' version '2.1.1'
}

apply from: file('../../gradle/target-conventions/shared.gradle')

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

sourceSets.main.resources.srcDir 'src/generated/resources'

commonJava {
    // Exclude only common files with confirmed differences for this target.
}

legacyForge {
    version = "${forge_minecraft_version}-${forge_version}"
    validateAccessTransformers = true
    accessTransformers {
        file('src/main/resources/META-INF/accesstransformer.cfg')
    }

    runs {
        client {
            client()
            gameDirectory = file('run')
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath(), '--existing', file('../../common/src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'net.jodah' && details.requested.name == 'typetools') {
            details.useVersion '0.6.3'
        }
        if (details.requested.group == 'net.minecraftforge' && details.requested.name == 'eventbus') {
            details.useVersion '5.0.3'
        }
        if (details.requested.group == 'net.minecraftforge' && details.requested.name == 'coremods') {
            details.useVersion '5.0.1'
        }
        if (details.requested.group == 'net.minecraftforge' && details.requested.name == 'forgespi') {
            details.useVersion '4.0.15-4.x'
        }
        if (details.requested.group == 'cpw.mods' && details.requested.name == 'modlauncher') {
            details.useVersion '9.1.3'
        }
        if (details.requested.group == 'org.apache.logging.log4j' && details.requested.name == 'log4j-api') {
            details.useVersion '2.17.1'
        }
        if (details.requested.group == 'org.apache.logging.log4j' && details.requested.name == 'log4j-core') {
            details.useVersion '2.17.1'
        }
    }
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "CentralForJodah"
                url = "https://repo1.maven.org/maven2/"
            }
        }
        filter { includeGroup "net.jodah" }
    }
    mavenCentral()
    maven {
        name = "MinecraftForge"
        url = "https://maven.minecraftforge.net/"
        content {
            includeGroup "net.minecraftforge"
            includeGroup "cpw.mods"
            includeGroup "de.oceanlabs.mcp"
        }
    }
    maven {
        name = "Curse Maven"
        url = "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    jarJar(implementation('org.tukaani:xz:1.10'))
    additionalRuntimeClasspath 'org.tukaani:xz:1.10'
    compileOnly 'maven.modrinth:curios:1.18.2-5.0.9.2'
}

// maven.neoforged.net is unreachable from this network; the Forge Maven mirror
// hosts the same legacy artifacts. Restrict the unavailable repository to the
// NeoFormRuntime tool so Gradle does not try it for Forge artifacts.
repositories.withType(MavenArtifactRepository).configureEach { repository ->
    if (repository.name == 'NeoForged Releases') {
        repository.content { includeGroup 'net.neoforged' }
    }
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version      : forge_minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : forge_loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1",
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }

    finalizedBy 'reobfJar'
}

jacoco {
    toolVersion = '0.8.12'
}

tasks.named('test', Test).configure {
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport', JacocoReport).configure {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

apply from: file('../../gradle/target-conventions/hot-debug.gradle')
configurations.runtimeClasspath.extendsFrom(configurations.hotDebugRuntime)
legacyForge.runs.configureEach {
    additionalRuntimeClasspathConfiguration.setExtendsFrom(
            additionalRuntimeClasspathConfiguration.extendsFrom.findAll { it != configurations.hotDebugRuntime })
}
apply from: file('../../gradle/target-conventions/publish.gradle')
